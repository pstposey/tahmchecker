# XcodeGen spec — the source of truth for Redline.xcodeproj.
# The generated project is committed so it opens directly in Xcode.
# After editing this file, regenerate with:  xcodegen generate
name: Redline
options:
  bundleIdPrefix: com.pstposey
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple development team in Xcode › Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  RedlineCore:
    path: Packages/RedlineCore
targets:
  Redline:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: RedlineCore
      - sdk: ExternalAccessory.framework
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Redline
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: Redline connects to your OBD-II Bluetooth adapter to read live data from your vehicle. Data stays on this iPhone.
        # MFi (External Accessory) protocol strings for the OBDLink MX+.
        # UNVERIFIED: neither OBDLink nor Apple publishes the MX+'s string.
        # com.obdlink is used for OBDLink MFi adapters by two independent
        # open-source projects; com.scantool.stnobd is attributed by one to
        # the OBDLink EX (USB). iOS hides accessories whose protocol isn't
        # listed here, so the first hardware test confirms or corrects these
        # (the debug report logs every protocol the accessory advertises).
        # App Store distribution would additionally need OBDLink to approve
        # Redline's bundle ID; development builds don't (Apple DTS).
        UISupportedExternalAccessoryProtocols:
          - com.obdlink
          - com.scantool.stnobd
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pstposey.Redline
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  Redline:
    build:
      targets:
        Redline: all
    run:
      config: Debug
    archive:
      config: Release
